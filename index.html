<!-- Hamburger -->
<div id="hamburger" class="hamburger">
  <i class="bi bi-list"></i>
</div>

<!-- Mobile Menu -->
<div id="mobileMenu">
  <div class="menu-item" onclick="scrollToSection('hero')"><i class="bi bi-house-door me-2"></i>Trang Chủ</div>
  <div class="menu-item" onclick="scrollToSection('about')"><i class="bi bi-info-circle me-2"></i>Giới Thiệu</div>
  <div class="menu-item" onclick="scrollToSection('pricing')"><i class="bi bi-cash-stack me-2"></i>Bảng Giá</div>
  <div class="menu-item" onclick="scrollToSection('faq')"><i class="bi bi-question-circle me-2"></i>FAQ</div>
  <div class="menu-item" onclick="scrollToSection('reviews')"><i class="bi bi-star me-2"></i>Đánh Giá</div>
</div>

<style>
:root {--primary:#D6001C; --accent:#fff; --hover:#FF3C3C;}

.hamburger {
  position: fixed; top:20px; left:20px; font-size:2rem; color:var(--primary); cursor:pointer; z-index:1100;
  transition: transform 0.3s, color 0.3s;
}
.hamburger:hover {transform: rotate(10deg) scale(1.2); color:var(--hover);}

#mobileMenu {
  position: fixed; top:0; left:-250px;
  width:250px; height:100vh; background:var(--primary);
  display:flex; flex-direction:column; padding-top:80px;
  transition:0.3s; z-index:1050;
}
#mobileMenu.open {left:0;}

#mobileMenu .menu-item {
  display:flex; align-items:center; padding:15px 20px;
  font-size:1.2rem; color:var(--accent); cursor:pointer;
  transition: transform 0.3s, color 0.3s;
}
#mobileMenu .menu-item:hover {
  transform: translateX(10px);
  color:var(--hover);
}
#mobileMenu .menu-item i {
  animation: float 2s infinite alternate;
}
@keyframes float {
  0%{transform: translateY(0);}
  100%{transform: translateY(-5px);}
}
</style>

<script>
// Toggle Mobile Menu
const hamburger = document.getElementById('hamburger');
const mobileMenu = document.getElementById('mobileMenu');
hamburger.addEventListener('click',()=>{mobileMenu.classList.toggle('open');});

// Smooth scroll
function scrollToSection(id){
  document.getElementById(id).scrollIntoView({behavior:'smooth'});
  mobileMenu.classList.remove('open'); // đóng menu khi chọn
}
</script>
